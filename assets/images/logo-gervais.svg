<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Botanical Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer ring / cell aura -->
    <circle cx="50" cy="50" r="46" fill="url(#circleGrad)" stroke="#15803d" stroke-width="2" stroke-dasharray="4 2" opacity="0.6"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Central tree & DNA/Life spiral -->
    <!-- Trunk -->
    <path d="M 50 82 L 50 48" stroke="#166534" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Branch Left & Leaves -->
    <path d="M 50 64 C 40 60 32 50 32 40 C 32 32 40 32 48 44" fill="url(#leafGrad)" stroke="#14532d" stroke-width="1"/>
    <path d="M 50 52 C 38 42 34 28 42 22 C 48 18 52 28 50 52 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="1"/>
    
    <!-- Branch Right & Leaves -->
    <path d="M 50 64 C 60 60 68 50 68 40 C 68 32 60 32 52 44" fill="url(#leafGrad)" stroke="#14532d" stroke-width="1"/>
    <path d="M 50 52 C 62 42 66 28 58 22 C 52 18 48 28 50 52 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="1"/>
    
    <!-- Top Center Sprout / Crown -->
    <path d="M 50 46 C 45 32 48 16 50 12 C 52 16 55 32 50 46 Z" fill="#84cc16" stroke="#166534" stroke-width="1"/>
    
    <!-- Bio-active nodes / dots -->
    <circle cx="28" cy="38" r="3.5" fill="#84cc16"/>
    <circle cx="72" cy="38" r="3.5" fill="#84cc16"/>
    <circle cx="50" cy="11" r="3" fill="#bef264"/>
    <circle cx="38" cy="20" r="2.5" fill="#22c55e"/>
    <circle cx="62" cy="20" r="2.5" fill="#22c55e"/>
  </g>

  <!-- Typography: GERVAIS PARTNERS -->
  <g transform="translate(125, 20)">
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="1.5">
      GERVAIS <tspan fill="#15803d" font-weight="700">PARTNERS</tspan>
    </text>
    
    <!-- Subtitle divider -->
    <line x1="2" y1="56" x2="350" y2="56" stroke="#22c55e" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="200" cy="56" r="3" fill="#84cc16"/>

    <!-- Subtitle / Positioning -->
    <text x="3" y="75" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569" letter-spacing="3.2">
      NUTRACEUTICAL INGREDIENTS • EUROPE
    </text>
  </g>
</svg>
